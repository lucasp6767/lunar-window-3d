<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNAR WINDOW 3D</title>
<style>
body{margin:0;background:#05070b;color:white;font-family:Arial}
#view{position:fixed;inset:0}
#panel{position:fixed;top:18px;left:18px;background:#101723e8;
padding:18px;border:1px solid #344256;border-radius:12px;
width:290px;max-width:calc(100vw - 72px)}
h2{margin:0 0 8px;font-size:19px}
small{color:#aebdd0}
button{background:#25344b;color:white;border:1px solid #526580;
border-radius:7px;padding:9px;margin:8px 4px 8px 0;cursor:pointer}
button:hover{background:#365376}
input{width:100%}
#status{font-size:12px;color:#a8c8e9;line-height:1.5}
#coords{position:fixed;bottom:16px;left:18px;background:#101723df;
padding:10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
<h2>🌕 LUNAR WINDOW 3D</h2>
<small>NASA LOLA + NASA LROC</small>
<div>
<button id="orbit">Vista orbital</button>
<button id="surface">Superficie</button>
</div>
<label>Exageración vertical: <span id="scaleLabel">3×</span></label>
<input id="scale" type="range" min="1" max="15" step="0.5" value="3">
<p id="status">Cargando datos científicos...</p>
<small>Orbital: mouse para explorar · Superficie: WASD + arrastrar para mirar</small>
</div>
<div id="coords">Esperando terreno...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);

const camera = new THREE.PerspectiveCamera(
  60, innerWidth/innerHeight, 0.01, 5000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('view').appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxDistance = 1500;

scene.add(new THREE.AmbientLight(0xffffff,1.25));

const sun = new THREE.DirectionalLight(0xffffff,1.6);
sun.position.set(-100,200,80);
scene.add(sun);

const status = document.getElementById('status');
const coords = document.getElementById('coords');

let terrainMesh;
let geometry;
let heights;
let terrainData;
let extentX;
let extentY;
let verticalScale = 3;

function elevationAt(x,z){
  if(!terrainData)return 0;
  const n=terrainData.width;
  const col=Math.max(0,Math.min(n-1,
    Math.round((x/extentX+0.5)*(n-1))));
  const row=Math.max(0,Math.min(n-1,
    Math.round((0.5-z/extentY)*(n-1))));
  return heights[row*n+col]/1000*verticalScale;
}

async function loadTerrain(){
  const response=await fetch('/static/data/lola_terrain.json');
  if(!response.ok)throw Error('No se pudo cargar LOLA');
  terrainData=await response.json();

  const n=terrainData.width;
  extentX=terrainData.extent_x_m/1000;
  extentY=terrainData.extent_y_m/1000;
  heights=terrainData.elevations_m;

  geometry=new THREE.PlaneGeometry(
    extentX,extentY,n-1,n-1
  );
  geometry.rotateX(-Math.PI/2);

  const positions=geometry.attributes.position;

  for(let row=0;row<n;row++){
    for(let col=0;col<n;col++){
      const vertex=row*n+col;
      const demRow=n-1-row;
      const height=heights[demRow*n+col];
      positions.setY(vertex,height/1000*verticalScale);
    }
  }

  positions.needsUpdate=true;
  geometry.computeVertexNormals();

  const texture=new THREE.TextureLoader().load(
    '/static/data/lroc_texture.png',
    ()=>status.textContent=
      'NASA LOLA + LROC cargados correctamente',
    undefined,
    ()=>status.textContent=
      'LOLA cargado; error en fotografía LROC'
  );

  texture.colorSpace=THREE.SRGBColorSpace;

  // El DEM se invierte verticalmente al construir
  // la geometría, por eso se ajusta también la textura.
  texture.flipY=false;

  terrainMesh=new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({
      map:texture,
      side:THREE.DoubleSide,
      roughness:1
    })
  );

  scene.add(terrainMesh);

  camera.position.set(110,130,150);
  controls.target.set(0,0,0);
  controls.update();

  status.textContent='Relieve LOLA cargado. Cargando LROC...';
}

let surfaceMode = false;
let yaw = 0;
let pitch = 0;
let dragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let eyeHeight = 0.0017;
const keys = new Set();
const clock = new THREE.Clock();

function groundHeight(x,z){
  if(!terrainData) return 0;
  const n = terrainData.width;
  const gx = THREE.MathUtils.clamp(
    (x/extentX+0.5)*(n-1),0,n-1);
  const gz = THREE.MathUtils.clamp(
    (0.5-z/extentY)*(n-1),0,n-1);
  const x0=Math.floor(gx), z0=Math.floor(gz);
  const x1=Math.min(x0+1,n-1);
  const z1=Math.min(z0+1,n-1);
  const tx=gx-x0, tz=gz-z0;
  const a=THREE.MathUtils.lerp(
    heights[z0*n+x0],heights[z0*n+x1],tx);
  const b=THREE.MathUtils.lerp(
    heights[z1*n+x0],heights[z1*n+x1],tx);
  return THREE.MathUtils.lerp(a,b,tz)/1000*verticalScale;
}

function updateSurfaceLook(){
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

function enterSurface(){
  if(!terrainData)return;
  surfaceMode=true;
  controls.enabled=false;
  keys.clear();
  camera.position.set(0,groundHeight(0,0)+eyeHeight,0);
  yaw=0;
  pitch=0;
  updateSurfaceLook();
  status.textContent=
    'Superficie: WASD para caminar · Arrastrar para mirar · Shift para acelerar';
}

function enterOrbit(){
  surfaceMode=false;
  dragging=false;
  keys.clear();
  controls.enabled=true;
  camera.position.set(110,130,150);
  controls.target.set(0,0,0);
  camera.up.set(0,1,0);
  controls.update();
  status.textContent='Vista orbital NASA LOLA + LROC';
}

document.getElementById('orbit').onclick=enterOrbit;
document.getElementById('surface').onclick=enterSurface;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(!surfaceMode || e.button!==0)return;
  dragging=true;
  lastMouseX=e.clientX;
  lastMouseY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!surfaceMode || !dragging)return;
  yaw-=(e.clientX-lastMouseX)*0.003;
  pitch-=(e.clientY-lastMouseY)*0.003;
  pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45);
  lastMouseX=e.clientX;
  lastMouseY=e.clientY;
  updateSurfaceLook();
});

renderer.domElement.addEventListener('pointerup',()=>{
  dragging=false;
});
renderer.domElement.addEventListener('pointercancel',()=>{
  dragging=false;
});

addEventListener('keydown',e=>{
  if(['KeyW','KeyA','KeyS','KeyD',
      'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
      'ShiftLeft','ShiftRight'].includes(e.code)){
    if(surfaceMode)e.preventDefault();
    keys.add(e.code);
  }
});

addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());

function moveOnSurface(dt){
  if(!surfaceMode || !terrainData)return;

  const forward=Number(keys.has('KeyW')||keys.has('ArrowUp'))
    -Number(keys.has('KeyS')||keys.has('ArrowDown'));
  const sideways=Number(keys.has('KeyD')||keys.has('ArrowRight'))
    -Number(keys.has('KeyA')||keys.has('ArrowLeft'));

  const distance=Math.hypot(forward,sideways);

  if(distance>0){
    // Velocidades en kilómetros por segundo.
    // Normal: 3 km/s. Shift: 10 km/s.
    const speed=(keys.has('ShiftLeft')||
      keys.has('ShiftRight'))?10:3;

    const totalStep=speed*Math.min(dt,0.05);

    // Dividir el movimiento en pasos cortos.
    const steps=Math.max(1,Math.ceil(totalStep/0.01));
    const step=totalStep/steps/distance;

    for(let i=0;i<steps;i++){
      const dx=(-Math.sin(yaw)*forward+
        Math.cos(yaw)*sideways)*step;
      const dz=(-Math.cos(yaw)*forward-
        Math.sin(yaw)*sideways)*step;

      camera.position.x=THREE.MathUtils.clamp(
        camera.position.x+dx,-extentX/2+0.01,extentX/2-0.01);
      camera.position.z=THREE.MathUtils.clamp(
        camera.position.z+dz,-extentY/2+0.01,extentY/2-0.01);

      // Mantener la cámara sobre la superficie.
      camera.position.y=groundHeight(
        camera.position.x,camera.position.z)+eyeHeight;
    }
  }

  // Ajuste inmediato incluso cuando estamos quietos.
  camera.position.y=groundHeight(
    camera.position.x,camera.position.z)+eyeHeight;
}
document.getElementById('scale').oninput=e=>{
  verticalScale=Number(e.target.value);
  document.getElementById('scaleLabel').textContent=
    verticalScale+'×';

  if(!geometry||!terrainData)return;

  const n=terrainData.width;
  const positions=geometry.attributes.position;

  for(let row=0;row<n;row++){
    for(let col=0;col<n;col++){
      const vertex=row*n+col;
      const demRow=n-1-row;
      positions.setY(
        vertex,
        heights[demRow*n+col]/1000*verticalScale
      );
    }
  }

  positions.needsUpdate=true;
  geometry.computeVertexNormals();
  if(surfaceMode){
    camera.position.y=groundHeight(
      camera.position.x,camera.position.z)+eyeHeight;
  }
};

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  if(surfaceMode){
    moveOnSurface(dt);
  }else{
    controls.update();
  }

  if(terrainData){
    const x=surfaceMode?camera.position.x:controls.target.x;
    const z=surfaceMode?camera.position.z:controls.target.z;
    coords.textContent=
      'X: '+x.toFixed(3)+' km | Y: '+
      (-z).toFixed(3)+' km | Elevación relativa: '+
      (groundHeight(x,z)/verticalScale*1000).toFixed(1)+' m'+
      (surfaceMode?' | Modo superficie':' | Modo orbital');
  }

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

loadTerrain().catch(error=>{
  console.error(error);
  status.textContent='ERROR: '+error.message;
});

animate();
</script>
</body>
</html>
